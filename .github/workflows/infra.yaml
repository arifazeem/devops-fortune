name: Infracost PR Comment

on:
  pull_request:
permissions:
  pull-requests: write # ✅ allow commenting on PRs
  contents: read
jobs:
  infracost:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.6.6

      - name: Terraform Init & Plan
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: us-east-1 # or your region
        run: |
          cd terraform
          terraform init
          terraform plan -out tfplan.binary
          terraform show -json tfplan.binary > plan.json

      - name: Setup Infracost
        uses: infracost/actions/setup@v3
        with:
          api-key: ${{ secrets.INFRACOST_API_KEY }}

      - name: Run Infracost
        run: |
          infracost breakdown --path plan.json --format json --out-file infracost.json

      - name: Summarize with LLM
        run: |
          pip install google-generativeai
          python scripts/rag_summary.py infracost.json > comment.md
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

      - name: Post PR Comment
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          path: comment.md
